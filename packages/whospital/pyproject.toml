[project]
name = "whospital"
version = "0.1.0"
description = "Django project depending on whealth"
requires-python = ">=3.14"
dependencies = [
    "django>=5.0",
    "whealth[rich]",
    "procrastinate>=3.0",
    "psycopg[binary]>=3.3.4",
    "testcontainers[postgres]>=4.14.2",
    "dj-database-url>=2.0",
    "granian>=1.7",
]

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
whealth = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "whospital.settings"
pythonpath = ["src"]
markers = [
    "control: Mark a test that creates a temporary control via the tmp_control fixture.",
]

[tool.pytest-testcontainers-django]
postgres_image = "postgres:16-alpine"
postgres_user = "postgres"
postgres_password = "postgres"
postgres_database = "postgres"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
]
