[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".venv", "migrations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C90",
    "D",
    "S",
    "A", "B", "DTZ", "T10", "EM", "EXE", "G", "UP", "ASYNC", "INP",
    "T20", "PT", "SLOT", "TCH", "PTH", "FIX", "ERA", "RUF", "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use `httpx` instead, which has timeouts by default."

[tool.ruff.lint.per-file-ignores]
"*/models.py" = ["D105", "D106"]
"*test_*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = [
    "/\\.venv/",
    "/migrations/",
    "/tests/",
]

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["whealth.models"]
disable_error_code = ["var-annotated", "no-any-return"]

[[tool.mypy.overrides]]
module = ["sentry_sdk"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["whospital.settings"]
disable_error_code = ["var-annotated"]

[tool.uv]
dev-dependencies = [
    "django-stubs>=5.0",
    "mypy>=2.1.0",
    "pytest>=8.0",
    "pytest-django>=4.0",
    "pytest-testcontainers-django>=0.2.2",
    "rich>=13.0",
    "ruff>=0.15.15",
]

[tool.uv.workspace]
members = ["packages/*"]
