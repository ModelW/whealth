[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C90",
    "D",
    "S",
    "A", "B", "DTZ", "T10", "EM", "EXE", "G", "UP", "ASYNC", "INP",
    "T20", "PT", "SLOT", "TCH", "PTH", "FIX", "ERA", "RUF", "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use `httpx` instead, which has timeouts by default."

[tool.uv]
dev-dependencies = [
    "ruff>=0.15.15",
]

[tool.uv.workspace]
members = ["packages/*"]
